<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Robi en clase</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- Primera vez en este aparato: la dirección de la nube y la clave (quedan solo aquí) -->
<section id="configurar" class="pantalla">
  <div class="tarjeta">
    <h1>🤖 Robi en clase</h1>
    <p>Pega la dirección de la aplicación web de Google (termina en <b>/exec</b>) y la clave que te dio <b>instalar()</b>.</p>
    <form id="formNube">
      <input name="url" placeholder="https://script.google.com/macros/s/…/exec" required autocomplete="off">
      <input name="clave" placeholder="Clave" required autocomplete="off">
      <button>💾 Conectar</button>
      <p id="nubeMensaje"></p>
    </form>
  </div>
</section>

<!-- Inicio: las clases de hoy -->
<section id="inicio" class="pantalla">
  <header>
    <h1>🤖 Robi</h1>
    <div id="hoyFecha"></div>
    <span id="estadoNube"></span>
    <button id="btnActualizar" title="Traer lo último de la nube">🔄</button>
  </header>
  <div id="vozEstado" class="aviso oculto"></div>
  <div id="clasesHoy"></div>
  <details id="otrosGrupos"><summary>Abrir otro grupo</summary><div id="listaGrupos"></div></details>
  <p class="pie"><button id="btnNube" class="chico">⚙️ Cambiar la nube</button></p>
</section>

<!-- La clase: Robi en grande -->
<section id="clase" class="pantalla">
  <header>
    <button id="btnVolver">⬅</button>
    <div id="tituloGrupo"></div>
    <div id="reloj"></div>
    <button id="btnFaltaron">🙋 ¿Quién faltó?</button>
    <button id="btnGlobo" title="Empezar los 10 minutos del globo ahora">🎈</button>
    <button id="btnFlotante" title="Robi en una ventanita encima de otras pestañas">🪟</button>
  </header>
  <div id="escenario">
    <div id="robi">
      <div id="burbuja" class="oculto"></div>
      <canvas id="robiCanvas" width="64" height="64" aria-label="Robi"></canvas>
    </div>

    <!-- El globo de los últimos 10 minutos: se infla y explota cuando termina la clase -->
    <div id="globo" class="oculto">
      <div id="globoCuerpo">
        <svg viewBox="0 0 100 130" aria-hidden="true">
          <path id="globoForma" d="M50 4C24 4 8 26 8 52c0 30 24 52 42 58 18-6 42-28 42-58C92 26 76 4 50 4z"/>
          <ellipse cx="33" cy="32" rx="9" ry="15" fill="#fff" opacity=".35" transform="rotate(-25 33 32)"/>
          <path d="M44 110l6 8 6-8z" id="globoNudo"/>
        </svg>
        <div id="globoTiempo"></div>
      </div>
      <svg id="globoHilo" viewBox="0 0 20 200" preserveAspectRatio="none" aria-hidden="true"><path d="M10 0 C0 50 20 100 10 150 C4 180 12 190 10 200"/></svg>
    </div>
    <div id="globoMensaje" class="oculto"></div>
  </div>

  <!-- ¿Quién faltó? Los niños (o el profe) tocan a los que no vinieron -->
  <div id="asistencia" class="capa oculto">
    <h2 id="asisTitulo">¿Quién faltó hoy?</h2>
    <p class="sub">Toquen a los compañeros que <b>no vinieron</b>. Si se equivocan, toquen otra vez.</p>
    <div id="tarjetas"></div>
    <div class="botones">
      <button id="btnTodos" class="verde">🎉 ¡Vinimos todos!</button>
      <button id="btnListo" class="azul">✅ ¡Listo, Robi!</button>
    </div>
  </div>
</section>

<canvas id="confeti"></canvas>
<script type="module" src="app.js"></script>
</body>
</html>
